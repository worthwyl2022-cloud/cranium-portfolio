name: Repository Visibility Manager

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - dry-run
          - make-public
          - make-private
      target_repos:
        description: "Comma-separated list of repository names (leave empty for all private repos owned by the authenticated user)"
        required: false
        type: string

permissions:
  contents: read

# IMPORTANT:
# This workflow requires a fine-grained Personal Access Token (or GitHub App installation token)
# stored as the repository secret REPO_ADMIN_TOKEN with administration:write (or equivalent)
# permission on the target repositories. The default GITHUB_TOKEN does not have sufficient
# scope to change repository visibility.
#
# Recommended practice:
# 1. Create a fine-grained PAT limited to the specific repositories that may be toggled.
# 2. Store it as REPO_ADMIN_TOKEN.
# 3. Always run dry-run first.
# 4. Verify the resulting visibility state before communicating externally.

jobs:
  manage-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: repository-visibility-manager
      cancel-in-progress: false
    steps:
      - name: Validate inputs and prepare
        id: prep
        run: |
          echo "Action: ${{ inputs.action }}"
          echo "Target repos input: '${{ inputs.target_repos }}'"

          if [ -z "${{ secrets.REPO_ADMIN_TOKEN }}" ]; then
            echo "::error::REPO_ADMIN_TOKEN secret is not configured. This workflow cannot change visibility without it."
            exit 1
          fi

      - name: List candidate repositories
        id: list
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          # Fetch repositories owned by the authenticated user
          gh api user/repos --paginate --jq '.[] | select(.owner.login == "worthwyl2022-cloud") | "\(.name)\t\(.private)\t\(.visibility)"' > /tmp/all_repos.tsv

          echo "All owned repositories:"
          cat /tmp/all_repos.tsv

          if [ -n "${{ inputs.target_repos }}" ]; then
            echo "${{ inputs.target_repos }}" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > /tmp/targets.txt
          else
            # Default: all currently private repositories
            awk -F'\t' '$2 == "true" {print $1}' /tmp/all_repos.tsv > /tmp/targets.txt
          fi

          echo "Target repositories for this run:"
          cat /tmp/targets.txt

          echo "target_count=$(wc -l < /tmp/targets.txt)" >> $GITHUB_OUTPUT

      - name: Execute visibility action
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          while IFS= read -r repo || [ -n "$repo" ]; do
            [ -z "$repo" ] && continue
            echo "----------------------------------------"
            echo "Processing: $repo"

            current=$(gh api "repos/worthwyl2022-cloud/$repo" --jq '.private')
            echo "Current private flag: $current"

            case "$ACTION" in
              dry-run)
                echo "[DRY-RUN] Would act on $repo (currently private=$current)"
                ;;
              make-public)
                if [ "$current" = "true" ]; then
                  echo "Making $repo public..."
                  gh api -X PATCH "repos/worthwyl2022-cloud/$repo" -f private=false -f visibility=public
                  echo "Done."
                else
                  echo "$repo is already public. Skipping."
                fi
                ;;
              make-private)
                if [ "$current" = "false" ]; then
                  echo "Making $repo private..."
                  gh api -X PATCH "repos/worthwyl2022-cloud/$repo" -f private=true -f visibility=private
                  echo "Done."
                else
                  echo "$repo is already private. Skipping."
                fi
                ;;
              *)
                echo "Unknown action: $ACTION"
                exit 1
                ;;
            esac
          done < /tmp/targets.txt

      - name: Summary
        run: |
          echo "### Visibility Manager Run" >> $GITHUB_STEP_SUMMARY
          echo "- Action: \`${{ inputs.action }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Targets processed: ${{ steps.list.outputs.target_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Automatic revert: not implemented; use a separate explicit make-private run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Always verify the resulting visibility state in the GitHub UI or via API before communicating externally." >> $GITHUB_STEP_SUMMARY
